# fly.toml app configuration file generated for signalbox-hub on 2026-07-30T11:02:33+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'signalbox-hub'
primary_region = 'lhr'

[build]
  dockerfile = '../Dockerfile'

[env]
  SIGNALBOX_DATA_DIR = '/data'

[[mounts]]
  source = 'signalbox_data'
  destination = '/data'

[http_service]
  internal_port = 8377
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
