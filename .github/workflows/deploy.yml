# Publishing stays independent of release automation so tagged images can be
# rebuilt on demand without cutting a release.
name: deploy

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false
    secrets:
      FLY_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is linux/amd64 only for now because Fly machines are amd64.
      # Multi-arch needs QEMU emulation for the bun compile and roughly triples
      # the job time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: components/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/dwmkerr/signalbox:${{ inputs.version }}
            ${{ inputs.push_latest && 'ghcr.io/dwmkerr/signalbox:latest' || '' }}

  # Publishing an image is not deploying it: fly runs whatever was last pushed
  # to it, so without this a release updated ghcr and left the running hub on
  # the previous build. Skipped rather than failed when FLY_API_TOKEN is absent,
  # so a fork or a token-less repo still gets its image published.
  fly:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - id: token
        run: echo "present=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.present == 'false'
        run: echo "FLY_API_TOKEN is not set; skipping the hub deploy." >> "$GITHUB_STEP_SUMMARY"

      - if: steps.token.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Built here rather than deployed from the image just pushed, so the
      # deploy needs no registry credentials on the fly side.
      - if: steps.token.outputs.present == 'true'
        run: >
          flyctl deploy
          --config components/deploy/fly/fly.toml
          --dockerfile components/deploy/Dockerfile
          --app signalbox-hub
          --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - if: steps.token.outputs.present == 'true'
        run: |
          echo "Deployed ${{ inputs.version }} to signalbox-hub." >> "$GITHUB_STEP_SUMMARY"
          curl -sf --max-time 20 https://signalbox-hub.fly.dev/healthz \
            | tee -a "$GITHUB_STEP_SUMMARY"
