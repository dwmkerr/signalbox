# Publishing stays independent of release automation so tagged images can be
# rebuilt on demand without cutting a release.
name: deploy

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false
    secrets:
      FLY_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is linux/amd64 only for now because Fly machines are amd64.
      # Multi-arch needs QEMU emulation for the bun compile and roughly triples
      # the job time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: components/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/dwmkerr/signalbox:${{ inputs.version }}
            ${{ inputs.push_latest && 'ghcr.io/dwmkerr/signalbox:latest' || '' }}

  # Publishing an image is not deploying it: fly runs whatever was last pushed
  # to it, so without this a release updated ghcr and left the running hub on
  # the previous build. Deliberately no skip-when-unset path - a release that
  # quietly does not deploy is the failure this job exists to prevent, and it
  # is better to fail the release loudly than to leave the hub behind again.
  fly:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Built here rather than deployed from the image just pushed, so the
      # deploy needs no registry credentials on the fly side.
      - run: >
          flyctl deploy
          --config components/deploy/fly/fly.toml
          --dockerfile components/deploy/Dockerfile
          --app signalbox-hub
          --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The deploy is not done because flyctl exited 0; it is done when the hub
      # answers. Fails the release if it does not.
      - name: Verify the hub answers
        run: |
          for attempt in $(seq 1 10); do
            if curl -sf --max-time 10 https://signalbox-hub.fly.dev/healthz -o /tmp/healthz; then
              cat /tmp/healthz >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "signalbox-hub did not answer /healthz after the deploy" >&2
          exit 1
