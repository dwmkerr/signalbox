# Publishing stays independent of release automation so tagged images can be
# rebuilt on demand without cutting a release.
name: deploy

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is linux/amd64 only for now because Fly machines are amd64.
      # Multi-arch needs QEMU emulation for the bun compile and roughly triples
      # the job time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: components/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/dwmkerr/signalbox:${{ inputs.version }}
            ${{ inputs.push_latest && 'ghcr.io/dwmkerr/signalbox:latest' || '' }}
