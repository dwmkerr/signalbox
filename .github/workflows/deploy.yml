# Publishing stays independent of release automation so tagged images can be
# rebuilt on demand without cutting a release.
name: deploy

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false
      docker:
        type: boolean
        default: true
      fly:
        type: boolean
        default: true
      brew:
        type: boolean
        default: true
    secrets:
      FLY_API_TOKEN:
        required: true
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      push_latest:
        type: boolean
        default: false
      docker:
        type: boolean
        default: true
      fly:
        type: boolean
        default: true
      brew:
        type: boolean
        default: true

jobs:
  deploy:
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is linux/amd64 only for now because Fly machines are amd64.
      # Multi-arch needs QEMU emulation for the bun compile and roughly triples
      # the job time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: components/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/dwmkerr/signalbox:${{ inputs.version }}
            ${{ inputs.push_latest && 'ghcr.io/dwmkerr/signalbox:latest' || '' }}

  # Publishing an image is not deploying it: fly runs whatever was last pushed
  # to it, so without this a release updated ghcr and left the running hub on
  # the previous build. Deliberately no skip-when-unset path - a release that
  # quietly does not deploy is the failure this job exists to prevent, and it
  # is better to fail the release loudly than to leave the hub behind again.
  fly:
    needs: deploy
    # always() so a deliberately skipped docker does not skip fly with it. The
    # result check still stops fly deploying on top of a failed image push.
    if: ${{ always() && inputs.fly && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Built here rather than deployed from the image just pushed, so the
      # deploy needs no registry credentials on the fly side.
      - run: >
          flyctl deploy
          --config components/deploy/fly/fly.toml
          --dockerfile components/deploy/Dockerfile
          --app signalbox-hub
          --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The deploy is not done because flyctl exited 0; it is done when the hub
      # answers. Fails the release if it does not.
      - name: Verify the hub answers
        run: |
          for attempt in $(seq 1 10); do
            if curl -sf --max-time 10 https://signalbox-hub.fly.dev/healthz -o /tmp/healthz; then
              cat /tmp/healthz >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "signalbox-hub did not answer /healthz after the deploy" >&2
          exit 1

  # The cask carries the notarized zip's checksum, so this reads the release
  # rather than building anything. That is also why it can republish the cask
  # for an older version on demand, long after its release run has gone.
  brew:
    if: ${{ inputs.brew }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Update cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
        run: |
          version="${TAG#v}"
          export VERSION="$version"
          export SHA_APP="$(gh release download "$TAG" \
            --pattern "Signalbox-${version}.zip.sha256" -O - | cut -d' ' -f1)"
          envsubst < packaging/signalbox-cask.rb.tmpl > signalbox.rb

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dwmkerr/homebrew-tools.git" tap
          mkdir -p tap/Casks
          cp signalbox.rb tap/Casks/signalbox.rb
          cd tap
          # A pre-cask formula, if one was ever pushed, must go: a tap with
          # both makes `brew install dwmkerr/tools/signalbox` ambiguous.
          git rm -f Formula/signalbox.rb 2>/dev/null || true
          git config user.name "dwmkerr"
          git config user.email "dwmkerr@gmail.com"
          git add Casks/signalbox.rb
          # Re-publishing a version already in the tap is a no-op, not a
          # failure: the point of dispatching one channel is to be able to
          # retry it safely.
          if git diff --cached --quiet; then
            echo "cask already at ${TAG}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: update signalbox cask to ${TAG}"
          git push
